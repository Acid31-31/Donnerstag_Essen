<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gastgeber · Bestellrunde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="brand-mark">BR</div>
      <div style="flex:1">
        <h1 id="heading">Bestellrunde</h1>
        <p>Gastgeber-Ansicht · Cloud</p>
      </div>
      <a class="btn btn-ghost btn-small" id="openSettings" href="#">Einstellungen</a>
    </div>

    <section class="panel">
      <div class="stats">
        <div class="stat"><span>Bestellungen</span><strong id="count">0</strong></div>
        <div class="stat"><span>Personen</span><strong id="people">0</strong></div>
        <div class="stat"><span>Gesamtsumme</span><strong id="total">0,00 €</strong></div>
      </div>
      <div class="pill"><span class="dot"></span> <span id="liveText">Lade…</span></div>
      <div id="orders" class="empty">Noch keine Bestellungen. Link in die Gruppe schicken.</div>
      <div class="total-bar"><span>Gesamt</span><span id="totalBar">0,00 €</span></div>
      <div class="actions">
        <button class="btn btn-primary" id="sendWhatsApp" type="button">An Lieferant senden</button>
        <button class="btn btn-ghost" id="copyText" type="button">Text kopieren</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="panel">
      <h2>Link für die Gruppe</h2>
      <p class="hint">Diesen Link in WhatsApp teilen. Bestellungen werden gespeichert, auch wenn dein Handy aus ist.</p>
      <div class="share-box">
        <input id="shareLink" readonly />
        <button class="btn btn-ghost" id="copyLink" type="button">Kopieren</button>
        <button class="btn btn-ghost" id="shareNative" type="button">Teilen</button>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      loadHostKey, euro, joinUrl, settingsUrl,
      buildWhatsAppText, whatsappLink, setStatus
    } from "./js/shared.js";
    import { watchRound, removeOrder } from "./js/store.js";

    const params = new URLSearchParams(location.search);
    const id = params.get("r");
    const hostKey = loadHostKey(id || "");
    const status = document.getElementById("status");
    let current = null;

    if (!id) location.href = "./";
    document.getElementById("openSettings").href = settingsUrl(id);

    if (!hostKey) {
      setStatus(status, "Einstellungen und Löschen nur auf dem Handy, mit dem die Runde gestartet wurde.", false);
    }

    function render(round) {
      current = round;
      document.getElementById("liveText").textContent = "Cloud verbunden";
      document.getElementById("heading").textContent = round.title || "Bestellrunde";
      document.getElementById("shareLink").value = joinUrl(round.id);
      document.getElementById("count").textContent = String((round.orders || []).length);
      document.getElementById("people").textContent = String(new Set((round.orders || []).map((o) => o.slogan)).size);
      document.getElementById("total").textContent = euro(round.total);
      document.getElementById("totalBar").textContent = euro(round.total);

      const box = document.getElementById("orders");
      if (!(round.orders || []).length) {
        box.className = "empty";
        box.textContent = "Noch keine Bestellungen. Link in die Gruppe schicken.";
        return;
      }

      box.className = "";
      box.innerHTML = round.orders.map((order) => `
        <article class="order-card">
          <header>
            <h3>${escapeHtml(order.slogan)}</h3>
            <strong>${euro(order.subtotal)}</strong>
          </header>
          <ul>
            ${order.items.map((item) => `
              <li>
                <div>
                  <div>${item.qty}× ${escapeHtml(item.name)}</div>
                  ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ""}
                </div>
                <span>${euro((item.qty || 1) * (item.price || 0))}</span>
              </li>
            `).join("")}
          </ul>
          ${hostKey ? `<div class="actions"><button class="btn btn-danger btn-small" data-delete="${order.id}" type="button">Entfernen</button></div>` : ""}
        </article>
      `).join("");

      box.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            await removeOrder(id, button.getAttribute("data-delete"));
            setStatus(status, "Bestellung entfernt.");
          } catch (error) {
            setStatus(status, error.message, true);
          }
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("copyLink").addEventListener("click", async () => {
      await navigator.clipboard.writeText(document.getElementById("shareLink").value);
      setStatus(status, "Link kopiert.");
    });

    document.getElementById("shareNative").addEventListener("click", async () => {
      const link = document.getElementById("shareLink").value;
      if (navigator.share) {
        await navigator.share({ title: "Bestellrunde", text: "Hier kannst du dein Essen bestellen:", url: link });
      } else {
        await navigator.clipboard.writeText(link);
        setStatus(status, "Link kopiert.");
      }
    });

    document.getElementById("copyText").addEventListener("click", async () => {
      if (!current) return;
      await navigator.clipboard.writeText(buildWhatsAppText(current));
      setStatus(status, "Bestelltext kopiert.");
    });

    document.getElementById("sendWhatsApp").addEventListener("click", () => {
      if (!current) return;
      if (!(current.orders || []).length) {
        setStatus(status, "Noch keine Bestellungen vorhanden.", true);
        return;
      }
      location.href = whatsappLink(current.whatsapp, buildWhatsAppText(current));
    });

    watchRound(id, render, (error) => {
      document.getElementById("liveText").textContent = "Fehler";
      setStatus(status, error.message, true);
    });
  </script>
</body>
</html>
