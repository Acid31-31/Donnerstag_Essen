<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Gastgeber · Donnerstag_Essen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/alien-hud.css?v=matrix12" />
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div>
        <div class="brand-mark">DE</div>
        <div>
          <h1 id="heading">DONNERSTAG_ESSEN</h1>
          <p>Nur Link teilen · Bestellungen in der App</p>
        </div>
      </div>
    </div>

    <section class="panel">
      <h2>Bestellungen</h2>
      <p class="hint" style="display:block">
        Auf der Webseite werden keine Bestellungen mehr angezeigt.
        Eingegangene Bestellungen siehst du nur in der <strong>Donnerstag_Essen</strong>-App
        unter „Neue Bestellungen“.
      </p>
      <div class="status" id="status"></div>
    </section>

    <section class="panel">
      <h2>Link für die Gruppe</h2>
      <div class="share-box">
        <input id="shareLink" readonly value="" />
        <button class="btn btn-ghost" id="copyLink" type="button">Kopieren</button>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-primary" id="shareWhatsApp" type="button">Link an WhatsApp senden</button>
      </div>
    </section>
  </main>
  <script type="module">
    import { joinUrl, setStatus } from "./js/shared.js?v=matrix12";
    import { getRound, getActiveRoundId, setActiveRound } from "./js/store.js?v=matrix12";

    const params = new URLSearchParams(location.search);
    const status = document.getElementById("status");
    let id = params.get("r") || "";

    async function resolveId() {
      if (id) return id;
      id = await getActiveRoundId();
      if (!id) throw new Error("Keine offene Runde");
      return id;
    }

    resolveId()
      .then(async (roundId) => {
        await setActiveRound(roundId).catch(() => null);
        const round = await getRound(roundId);
        document.getElementById("heading").textContent =
          (round.title || "DONNERSTAG_ESSEN").toUpperCase();
        const link = joinUrl(roundId);
        document.getElementById("shareLink").value = link;
        setStatus(status, "Runde aktiv. Bestellungen nur in der App sichtbar.");
      })
      .catch((error) => setStatus(status, error.message, true));

    document.getElementById("copyLink").addEventListener("click", async () => {
      const link = document.getElementById("shareLink").value;
      try {
        await navigator.clipboard.writeText(link);
        setStatus(status, "Link kopiert.");
      } catch {
        document.getElementById("shareLink").select();
        setStatus(status, "Link markiert – bitte kopieren.", true);
      }
    });

    document.getElementById("shareWhatsApp").addEventListener("click", () => {
      const link = document.getElementById("shareLink").value;
      if (!link) return;
      location.href = `https://wa.me/?text=${encodeURIComponent(link)}`;
    });
  </script>
</body>
</html>
