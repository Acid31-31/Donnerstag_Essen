<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gastgeber · Bestellrunde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="brand-mark">BR</div>
      <div style="flex:1">
        <h1 id="heading">Bestellrunde</h1>
        <p>Gastgeber-Ansicht · Live</p>
      </div>
      <a class="btn btn-ghost btn-small" id="openSettings" href="#">Einstellungen</a>
    </div>

    <section class="panel">
      <div class="stats">
        <div class="stat"><span>Bestellungen</span><strong id="count">0</strong></div>
        <div class="stat"><span>Personen</span><strong id="people">0</strong></div>
        <div class="stat"><span>Gesamtsumme</span><strong id="total">0,00 €</strong></div>
      </div>
      <div class="pill" id="livePill"><span class="dot"></span> <span id="liveText">Verbinde…</span></div>
      <div id="orders" class="empty">Noch keine Bestellungen. Link in die Gruppe schicken.</div>
      <div class="total-bar"><span>Gesamt</span><span id="totalBar">0,00 €</span></div>
      <div class="actions">
        <button class="btn btn-primary" id="sendWhatsApp" type="button">An Lieferant senden</button>
        <button class="btn btn-ghost" id="copyText" type="button">Text kopieren</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="panel">
      <h2>Link für die Gruppe</h2>
      <p class="hint">Diesen Link in WhatsApp teilen. Diese Seite muss während der Bestellung offen bleiben.</p>
      <div class="share-box">
        <input id="shareLink" readonly />
        <button class="btn btn-ghost" id="copyLink" type="button">Kopieren</button>
        <button class="btn btn-ghost" id="shareNative" type="button">Teilen</button>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      loadHostKey, loadRound, saveRound, euro, joinUrl, settingsUrl,
      buildWhatsAppText, whatsappLink, setStatus, createPeer, withTotals, newId
    } from "./js/shared.js";

    const params = new URLSearchParams(location.search);
    const id = params.get("r");
    const hostKey = loadHostKey(id || "");
    const status = document.getElementById("status");
    let current = null;
    const connections = new Set();

    if (!id) location.href = "./";
    if (!hostKey) {
      setStatus(status, "Diese Ansicht ist nur auf dem Handy des Gastgebers verfügbar.", true);
    }

    document.getElementById("openSettings").href = settingsUrl(id);

    function render(round) {
      current = withTotals(round);
      saveRound(current);
      document.getElementById("heading").textContent = current.title || "Bestellrunde";
      document.getElementById("shareLink").value = joinUrl(current.id);
      document.getElementById("count").textContent = String((current.orders || []).length);
      document.getElementById("people").textContent = String(new Set((current.orders || []).map((o) => o.slogan)).size);
      document.getElementById("total").textContent = euro(current.total);
      document.getElementById("totalBar").textContent = euro(current.total);

      const box = document.getElementById("orders");
      if (!(current.orders || []).length) {
        box.className = "empty";
        box.textContent = "Noch keine Bestellungen. Link in die Gruppe schicken.";
        return;
      }

      box.className = "";
      box.innerHTML = current.orders.map((order) => `
        <article class="order-card">
          <header>
            <h3>${escapeHtml(order.slogan)}</h3>
            <strong>${euro(order.subtotal)}</strong>
          </header>
          <ul>
            ${order.items.map((item) => `
              <li>
                <div>
                  <div>${item.qty}× ${escapeHtml(item.name)}</div>
                  ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ""}
                </div>
                <span>${euro((item.qty || 1) * (item.price || 0))}</span>
              </li>
            `).join("")}
          </ul>
          <div class="actions">
            <button class="btn btn-danger btn-small" data-delete="${order.id}" type="button">Entfernen</button>
          </div>
        </article>
      `).join("");

      box.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          current.orders = current.orders.filter((order) => order.id !== button.getAttribute("data-delete"));
          render(current);
          setStatus(status, "Bestellung entfernt.");
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function handleMessage(conn, data) {
      if (!data || !data.type) return;
      if (data.type === "hello") {
        conn.send({ type: "state", round: withTotals(current) });
        return;
      }
      if (data.type === "order") {
        const slogan = String(data.slogan || "").trim().slice(0, 60);
        const items = Array.isArray(data.items) ? data.items : [];
        const cleanItems = items
          .map((item) => ({
            name: String(item.name || "").trim().slice(0, 80),
            qty: Math.max(1, Math.min(99, Number(item.qty) || 1)),
            price: Math.max(0, Number(item.price) || 0),
            note: String(item.note || "").trim().slice(0, 160)
          }))
          .filter((item) => item.name);
        if (!slogan || !cleanItems.length) {
          conn.send({ type: "error", error: "Bestellung unvollständig" });
          return;
        }
        current.orders.push({
          id: newId(8),
          slogan,
          items: cleanItems,
          createdAt: new Date().toISOString()
        });
        render(current);
        conn.send({ type: "ok", round: withTotals(current) });
        setStatus(status, `Neue Bestellung von ${slogan}`);
      }
    }

    async function startHost() {
      current = loadRound(id) || null;
      if (!current) {
        setStatus(status, "Runde nicht gefunden. Bitte neu erstellen.", true);
        return;
      }
      render(current);
      try {
        const peer = await createPeer(id);
        document.getElementById("liveText").textContent = "Bereit für Bestellungen";
        peer.on("connection", (conn) => {
          connections.add(conn);
          conn.on("data", (data) => handleMessage(conn, data));
          conn.on("close", () => connections.delete(conn));
        });
        peer.on("disconnected", () => {
          document.getElementById("liveText").textContent = "Verbindung getrennt – Seite offen lassen";
          peer.reconnect();
        });
        peer.on("error", (error) => {
          setStatus(status, error.message || "Verbindungsfehler", true);
        });
      } catch (error) {
        document.getElementById("liveText").textContent = "Nicht erreichbar";
        setStatus(status, error.message || "Konnte Runde nicht öffnen", true);
      }
    }

    document.getElementById("copyLink").addEventListener("click", async () => {
      await navigator.clipboard.writeText(document.getElementById("shareLink").value);
      setStatus(status, "Link kopiert.");
    });

    document.getElementById("shareNative").addEventListener("click", async () => {
      const link = document.getElementById("shareLink").value;
      if (navigator.share) {
        await navigator.share({ title: "Bestellrunde", text: "Hier kannst du dein Essen bestellen:", url: link });
      } else {
        await navigator.clipboard.writeText(link);
        setStatus(status, "Link kopiert.");
      }
    });

    document.getElementById("copyText").addEventListener("click", async () => {
      if (!current) return;
      await navigator.clipboard.writeText(buildWhatsAppText(current));
      setStatus(status, "Bestelltext kopiert.");
    });

    document.getElementById("sendWhatsApp").addEventListener("click", () => {
      if (!current) return;
      if (!(current.orders || []).length) {
        setStatus(status, "Noch keine Bestellungen vorhanden.", true);
        return;
      }
      location.href = whatsappLink(current.whatsapp, buildWhatsAppText(current));
    });

    window.addEventListener("storage", (event) => {
      if (event.key === `bestellrunde-round-${id}` && event.newValue) {
        try {
          render(JSON.parse(event.newValue));
        } catch {
          /* ignore */
        }
      }
    });

    startHost();
  </script>
</body>
</html>
