<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gastgeber · Donnerstag_Essen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div>
        <div class="brand-mark">DE</div>
        <div>
          <h1>DONNERSTAG_ESSEN</h1>
          <p>Gastgeber · neue Runde</p>
        </div>
      </div>
      <div class="live-pill">HOST</div>
    </div>

    <section class="panel">
      <h2>Neue Runde starten</h2>
      <p class="hint">Danach teilst du nur noch <strong>Donnerstag_Essen</strong> in die Gruppe.</p>
      <div class="field">
        <label for="title">Name der Runde</label>
        <input id="title" maxlength="80" value="Donnerstag_Essen" />
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="create" type="button">Runde erstellen</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>
  <script type="module">
    import { saveHostKey, hostUrl, newId, setStatus } from "./js/shared.js";
    import { createRound } from "./js/store.js";

    const status = document.getElementById("status");
    document.getElementById("create").addEventListener("click", async () => {
      try {
        setStatus(status, "Runde wird angelegt…");
        const round = await createRound(document.getElementById("title").value);
        saveHostKey(round.id, newId(16));
        location.href = hostUrl(round.id);
      } catch (error) {
        setStatus(status, error.message, true);
      }
    });
  </script>
</body>
</html>
