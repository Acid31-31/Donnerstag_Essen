<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Bestellen · Donnerstag_Essen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/alien-hud.css?v=v18" />
  <style>
    .hud-aurora, .hud-hex, .hud-crt, .hud-scan-h, .hud-scan-h2, .hud-scan-v, .knx-stream { display: none !important; }
    #hud-canvas { z-index: 0 !important; }
    .shell { z-index: 2 !important; position: relative; max-width: 560px; }
    .order-simple .brand { margin-bottom: 14px; }
    .order-simple .brand h1 { font-size: clamp(0.75rem, 2.2vw, 0.95rem); }
    .order-simple .brand p { display: none; }
    .order-simple .live-pill { display: none; }
    .order-simple .panel { padding: 16px; }
    .order-simple .panel h2 {
      margin-bottom: 10px;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }
    .order-simple .hint { display: none; }
    .order-simple label {
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .order-simple input {
      font-size: 1.05rem;
      padding: 14px 14px;
    }
    .order-simple .row {
      grid-template-columns: 1fr 0.45fr 0.55fr auto;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(57, 215, 232, 0.12);
    }
    .order-simple .row:last-child { border-bottom: 0; }
    .order-simple .field { margin-bottom: 12px; }
    .order-simple .field.span-all { margin-top: 4px; }
    .order-simple .total-bar { margin-top: 10px; font-size: 0.9rem; }
    .status.error { color: #ff6b6b; font-weight: 600; }

    .menu-note {
      display: block !important;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.35;
    }
    .menu-search {
      width: 100%;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
    }
    .menu-cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .menu-cat {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: rgba(57, 215, 232, 0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .menu-cat.active {
      background: rgba(57, 215, 232, 0.22);
      border-color: var(--line-strong);
      color: var(--accent);
    }
    .menu-list {
      max-height: min(52vh, 420px);
      overflow: auto;
      border: 1px solid rgba(57, 215, 232, 0.14);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.2);
    }
    .menu-item {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid rgba(57, 215, 232, 0.1);
      background: transparent;
      color: inherit;
      padding: 12px 12px;
      cursor: pointer;
      font: inherit;
    }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item:active { background: rgba(57, 215, 232, 0.12); }
    .menu-item .title {
      font-size: 0.95rem;
      color: var(--text);
    }
    .menu-item .desc {
      grid-column: 1 / -1;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.3;
    }
    .menu-item .price {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .menu-empty {
      padding: 18px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .toast-add {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(11, 24, 36, 0.95);
      border: 1px solid var(--line-strong);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .toast-add.show { opacity: 1; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .chip {
      border: 1px solid var(--line);
      background: rgba(57, 215, 232, 0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font: inherit;
    }
    .chip.on {
      background: rgba(57, 215, 232, 0.24);
      border-color: var(--line-strong);
      color: var(--accent);
    }
    .sauce-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sauce-grid select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      padding: 12px 12px;
      font: inherit;
      font-size: 0.95rem;
    }
    .doner-box {
      display: none;
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid rgba(57, 215, 232, 0.18);
      border-radius: 12px;
      background: rgba(57, 215, 232, 0.06);
    }
    .doner-box.show { display: block; }
    .doner-box .sub {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }
  </style>
  <script>
    (function () {
      var DB = "https://bestellrunde-default-rtdb.firebaseio.com";
      var params = new URLSearchParams(location.search);
      var current = params.get("r") || "";
      fetch(DB + "/rounds/_active.json", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var active = data && data.id ? String(data.id) : "";
          if (!active) return;
          if (current !== active || params.get("v") !== "19") {
            location.replace(
              location.pathname + "?r=" + encodeURIComponent(active) + "&v=19"
            );
          }
        })
        .catch(function () {});
    })();
  </script>
</head>
<body>
  <main class="shell order-simple">
    <div class="brand">
      <div>
        <div class="brand-mark">DE</div>
        <div>
          <h1 id="heading">DONNERSTAG_ESSEN</h1>
          <p></p>
        </div>
      </div>
      <div class="live-pill">LIVE</div>
    </div>

    <section class="panel">
      <div class="field">
        <label for="slogan">Dein Name</label>
        <input id="slogan" name="besteller_name" maxlength="60" placeholder="z. B. Tom" autocomplete="off" autocapitalize="words" />
      </div>

      <h2>Menükarte</h2>
      <p class="menu-note" id="menuNote">Rathaus Grill Kruft – Gericht antippen, dann senden.</p>
      <input class="menu-search" id="menuSearch" type="search" placeholder="Suchen… z. B. Pizza, Döner, Schnitzel" autocomplete="off" />
      <div class="menu-cats" id="menuCats"></div>
      <div class="menu-list" id="menuList"><div class="menu-empty">Menü wird geladen…</div></div>
    </section>

    <section class="panel" style="margin-top:14px">
      <h2>Deine Bestellung</h2>
      <div id="items"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="addItem" type="button">+ Freitext</button>
      </div>
      <div class="total-bar"><span>Summe</span><span id="subtotal">0,00 €</span></div>
      <div class="actions">
        <button class="btn btn-primary" id="send" type="button">Bestellung senden</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="panel" id="done" hidden style="margin-top:14px">
      <h2>Gesendet</h2>
      <p class="hint" style="display:block">Gesendet. Die Bestellung erscheint nur in der App beim Gastgeber – hier gibt es keine Liste.</p>
      <div class="actions">
        <button class="btn btn-ghost" id="again" type="button">Noch etwas bestellen</button>
      </div>
    </section>
  </main>
  <div class="toast-add" id="toastAdd">Hinzugefügt</div>

  <script type="module">
    import { euro, money, setStatus } from "./js/shared.v15.js";
    import { getRound, addOrder, getActiveRoundId } from "./js/store.v15.js";
    import { mountHudBackground } from "./js/hud-bg.v15.js";

    mountHudBackground();

    const status = document.getElementById("status");
    const itemsBox = document.getElementById("items");
    const menuCats = document.getElementById("menuCats");
    const menuList = document.getElementById("menuList");
    const menuSearch = document.getElementById("menuSearch");
    const toastAdd = document.getElementById("toastAdd");
    let id = "";
    let menuData = null;
    let activeCat = "all";

    async function resolveRoundId() {
      const active = await getActiveRoundId();
      if (!active) throw new Error("Keine offene Bestellrunde");
      id = active;
      const next = `${location.pathname}?r=${encodeURIComponent(id)}&v=19`;
      if (location.pathname + location.search !== next) {
        history.replaceState(null, "", next);
      }
      return id;
    }

    const EXTRAS = [
      "Jalapeños",
      "Chilisauce",
      "Extra Käse",
      "Extra Fleisch",
      "Peperoni",
      "Doppel scharf",
      "Ohne Zwiebeln",
      "Ohne Salat",
      "Extra Mais"
    ];
    const SAUCES = [
      "Knoblauchsauce",
      "Kräutersauce",
      "Scharfe Sauce",
      "Cocktail-Sauce",
      "Tzatziki",
      "Joghurtsauce",
      "Ohne Sauce"
    ];
    const MEATS = ["Gemischt", "Hähnchen", "Kalb"];

    function donerText(row) {
      const dish = row.querySelector(".dish")?.value || "";
      const beilagen = row.querySelector(".beilagen")?.value || "";
      return `${dish} ${beilagen}`.toLowerCase();
    }

    function isDonerDish(rowOrName) {
      const n = (typeof rowOrName === "string"
        ? rowOrName
        : donerText(rowOrName)
      ).toLowerCase();
      if (!n.trim()) return false;
      return /döner|doner|drehspieß|drehspiess|kebab|kebap|giro|dönerfleisch|haehnchendreh|hähnchendreh|hähnchendöner|adana/.test(n);
    }

    function sauceOptions(selected) {
      return SAUCES.map((s) =>
        `<option value="${s}"${s === selected ? " selected" : ""}>${s}</option>`
      ).join("");
    }

    function buildExtras(selected = []) {
      return EXTRAS.map((extra) => {
        const on = selected.includes(extra) ? " on" : "";
        return `<button type="button" class="chip${on}" data-extra="${extra}">${extra}</button>`;
      }).join("");
    }

    function buildMeats(selected = "Gemischt") {
      return MEATS.map((meat) => {
        const on = meat === selected ? " on" : "";
        return `<button type="button" class="chip meat-chip${on}" data-meat="${meat}">${meat}</button>`;
      }).join("");
    }

    function composeNote(row) {
      const parts = [];
      const beilagen = row.querySelector(".beilagen").value.trim();
      if (beilagen) parts.push(`Beilagen: ${beilagen}`);
      const extras = [...row.querySelectorAll(".extras .chip.on")].map((el) => el.dataset.extra);
      if (extras.length) parts.push(`Zusatz: ${extras.join(", ")}`);
      if (isDonerDish(row) && row.querySelector(".doner-box").classList.contains("show")) {
        const meat = row.querySelector(".meat-chip.on")?.dataset.meat || "Gemischt";
        parts.push(`Fleisch: ${meat}`);
        const top = row.querySelector(".sauce-top").value;
        const bottom = row.querySelector(".sauce-bottom").value;
        if (top) parts.push(`Sauce oben: ${top}`);
        if (bottom) parts.push(`Sauce unten: ${bottom}`);
        if (top && bottom && top !== "Ohne Sauce" && bottom !== "Ohne Sauce") {
          parts.push("Döner voll mit Sauce (oben + unten)");
        }
      }
      return parts.join(" · ");
    }

    function syncDonerBox(row) {
      const box = row.querySelector(".doner-box");
      if (isDonerDish(row)) box.classList.add("show");
      else box.classList.remove("show");
    }

    function itemRow(preset = null) {
      const wrap = document.createElement("div");
      wrap.className = "row item-row";
      wrap.innerHTML = `
        <div class="field span-all">
          <label>Gericht</label>
          <input class="dish" name="dish_name" maxlength="80" placeholder="z. B. Pizza Salami" autocomplete="off" />
        </div>
        <div class="field">
          <label>Menge</label>
          <input class="qty" name="dish_qty" type="number" min="1" max="99" value="1" autocomplete="off" />
        </div>
        <div class="field">
          <label>Preis €</label>
          <input class="price" name="dish_price" type="number" min="0" step="0.1" placeholder="0,00" autocomplete="off" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-danger btn-small remove" type="button">×</button>
        </div>
        <div class="field span-all">
          <label>Beilagen</label>
          <input class="beilagen" name="dish_beilagen" maxlength="200" placeholder="was auf dem Gericht ist" autocomplete="off" />
        </div>
        <div class="field span-all">
          <label>Zusatz</label>
          <div class="chip-row extras">${buildExtras()}</div>
        </div>
        <div class="field span-all doner-box">
          <p class="sub">Döner-Gericht: Fleisch wählen, Sauce oben und unten – damit alles voll mit Sauce ist.</p>
          <label>Fleisch</label>
          <div class="chip-row meats">${buildMeats("Gemischt")}</div>
          <div class="sauce-grid" style="margin-top:10px">
            <div>
              <label>Sauce oben</label>
              <select class="sauce-top">${sauceOptions("Knoblauchsauce")}</select>
            </div>
            <div>
              <label>Sauce unten</label>
              <select class="sauce-bottom">${sauceOptions("Kräutersauce")}</select>
            </div>
          </div>
        </div>
      `;
      wrap.querySelector(".remove").addEventListener("click", () => {
        if (itemsBox.querySelectorAll(".item-row").length <= 1) {
          wrap.querySelector(".dish").value = "";
          wrap.querySelector(".qty").value = "1";
          wrap.querySelector(".price").value = "";
          wrap.querySelector(".beilagen").value = "";
          wrap.querySelectorAll(".extras .chip.on").forEach((el) => el.classList.remove("on"));
          wrap.querySelectorAll(".meat-chip").forEach((el) => {
            el.classList.toggle("on", el.dataset.meat === "Gemischt");
          });
          syncDonerBox(wrap);
        } else {
          wrap.remove();
        }
        updateSubtotal();
      });
      wrap.querySelector(".dish").addEventListener("input", () => syncDonerBox(wrap));
      wrap.querySelector(".beilagen").addEventListener("input", () => syncDonerBox(wrap));
      wrap.querySelectorAll(".extras .chip").forEach((chip) => {
        chip.addEventListener("click", () => chip.classList.toggle("on"));
      });
      wrap.querySelectorAll(".meat-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          wrap.querySelectorAll(".meat-chip").forEach((el) => el.classList.remove("on"));
          chip.classList.add("on");
        });
      });
      wrap.querySelectorAll("input, select").forEach((input) => {
        input.addEventListener("input", updateSubtotal);
        input.addEventListener("change", updateSubtotal);
      });
      if (preset) {
        wrap.querySelector(".dish").value = preset.name || "";
        wrap.querySelector(".price").value = preset.price != null ? String(preset.price) : "";
        wrap.querySelector(".beilagen").value = preset.note || preset.beilagen || "";
        wrap.querySelector(".qty").value = String(preset.qty || 1);
        syncDonerBox(wrap);
      }
      return wrap;
    }

    function readItems() {
      return [...itemsBox.querySelectorAll(".item-row")].map((row) => ({
        name: row.querySelector(".dish").value.trim(),
        qty: Number(row.querySelector(".qty").value || 1),
        price: money(row.querySelector(".price").value || 0),
        note: composeNote(row)
      })).filter((item) => item.name);
    }

    function updateSubtotal() {
      const sum = readItems().reduce((acc, item) => acc + item.qty * item.price, 0);
      document.getElementById("subtotal").textContent = euro(sum);
    }

    function showToast(text) {
      toastAdd.textContent = text;
      toastAdd.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastAdd.classList.remove("show"), 1400);
    }

    function addFromMenu(item) {
      const label = item.nr ? `${item.nr}. ${item.name}` : item.name;
      const emptyRows = [...itemsBox.querySelectorAll(".item-row")].filter((row) => {
        return !row.querySelector(".dish").value.trim();
      });
      const row = emptyRows[0] || itemRow();
      if (!emptyRows[0]) itemsBox.appendChild(row);
      row.querySelector(".dish").value = label;
      row.querySelector(".price").value = String(item.price ?? "");
      row.querySelector(".beilagen").value = item.desc || "";
      row.querySelector(".qty").value = "1";
      row.querySelectorAll(".chip.on").forEach((el) => el.classList.remove("on"));
      syncDonerBox(row);
      updateSubtotal();
      showToast(`+ ${label}`);
      document.getElementById("send").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function allItems() {
      if (!menuData) return [];
      return menuData.categories.flatMap((cat) =>
        (cat.items || []).map((item) => ({ ...item, category: cat.title, catId: cat.id }))
      );
    }

    function renderCats() {
      if (!menuData) return;
      menuCats.innerHTML = "";
      const cats = [{ id: "all", title: "Alle" }, ...menuData.categories];
      for (const cat of cats) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "menu-cat" + (activeCat === cat.id ? " active" : "");
        btn.textContent = cat.title;
        btn.addEventListener("click", () => {
          activeCat = cat.id;
          renderCats();
          renderMenu();
        });
        menuCats.appendChild(btn);
      }
    }

    function renderMenu() {
      if (!menuData) return;
      const q = menuSearch.value.trim().toLowerCase();
      let items = allItems();
      if (activeCat !== "all") items = items.filter((item) => item.catId === activeCat);
      if (q) {
        items = items.filter((item) => {
          const hay = `${item.nr || ""} ${item.name} ${item.desc || ""} ${item.category}`.toLowerCase();
          return hay.includes(q);
        });
      }
      if (!items.length) {
        menuList.innerHTML = `<div class="menu-empty">Kein Treffer.</div>`;
        return;
      }
      menuList.innerHTML = "";
      for (const item of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "menu-item";
        btn.innerHTML = `
          <span class="title">${item.nr ? item.nr + ". " : ""}${item.name}</span>
          <span class="price">${euro(item.price)}</span>
          ${item.desc ? `<span class="desc">${item.desc}</span>` : ""}
        `;
        btn.addEventListener("click", () => addFromMenu(item));
        menuList.appendChild(btn);
      }
    }

    async function loadMenu() {
      try {
        const res = await fetch("./js/menu-rathaus.json?v=19", { cache: "no-store" });
        if (!res.ok) throw new Error("Menü nicht ladbar");
        menuData = await res.json();
        document.getElementById("menuNote").textContent =
          `${menuData.restaurant} · ${menuData.note || "Gericht antippen zum Bestellen."}`;
        renderCats();
        renderMenu();
      } catch (error) {
        menuList.innerHTML = `<div class="menu-empty">${error.message || "Menü fehlt"}</div>`;
      }
    }

    menuSearch.addEventListener("input", renderMenu);

    document.getElementById("addItem").addEventListener("click", () => {
      itemsBox.appendChild(itemRow());
      updateSubtotal();
    });

    document.getElementById("again").addEventListener("click", () => {
      document.getElementById("done").hidden = true;
      document.getElementById("slogan").value = "";
      itemsBox.innerHTML = "";
      itemsBox.appendChild(itemRow());
      updateSubtotal();
      setStatus(status, "");
    });

    document.getElementById("send").addEventListener("click", async () => {
      try {
        id = await resolveRoundId();
        const slogan = document.getElementById("slogan").value.trim();
        const items = readItems();
        if (!slogan) throw new Error("Bitte deinen Namen eintragen");
        if (!items.length) throw new Error("Mindestens ein Gericht eintragen");
        setStatus(status, "Wird gespeichert…");
        await addOrder(id, { slogan, items });
        document.getElementById("done").hidden = false;
        setStatus(status, "Gespeichert in der aktuellen Runde.");
      } catch (error) {
        setStatus(status, error.message || "Senden fehlgeschlagen", true);
      }
    });

    itemsBox.appendChild(itemRow());
    updateSubtotal();
    loadMenu();

    resolveRoundId()
      .then((roundId) => getRound(roundId))
      .then((round) => {
        document.getElementById("heading").textContent = (round.title || "DONNERSTAG_ESSEN").toUpperCase();
        setStatus(status, "");
      })
      .catch((error) => setStatus(status, error.message, true));
  </script>
</body>
</html>
