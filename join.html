<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Bestellen · Donnerstag_Essen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/alien-hud.css?v=matrix4" />
  <style>
    /* Sicherheit: alte Overlay-Divs nie über Canvas legen */
    .hud-aurora, .hud-hex, .hud-crt, .hud-scan-h, .hud-scan-h2, .hud-scan-v, .knx-stream { display: none !important; }
    #hud-canvas { z-index: 0 !important; }
    .shell { z-index: 2 !important; position: relative; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div>
        <div class="brand-mark">DE</div>
        <div>
          <h1 id="heading">DONNERSTAG_ESSEN</h1>
          <p>// UNIT ORDER · YOUR TAG</p>
        </div>
      </div>
      <div class="live-pill">LIVE</div>
    </div>

    <div class="tile-grid">
      <section class="panel tile">
        <h2>Status</h2>
        <p class="hint" id="meta">Cloud-Sync aktiv</p>
        <div class="pill"><span class="dot"></span> LINK ONLINE</div>
      </section>

      <section class="panel tile">
        <h2>Slogan / Name</h2>
        <div class="field" style="margin:0">
          <input id="slogan" maxlength="60" placeholder="z. B. Tom – ohne Zwiebeln" />
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top:14px">
      <h2>Positionen</h2>
      <p class="hint">Jede Zeile = ein Gericht · Alien-Tile Sync</p>
      <div id="items"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="addItem" type="button">Gericht hinzufügen</button>
      </div>
      <div class="total-bar"><span>Summe</span><span id="subtotal">0,00 €</span></div>
      <div class="actions">
        <button class="btn btn-primary" id="send" type="button">Senden</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="panel" id="done" hidden style="margin-top:14px">
      <h2>Gesendet</h2>
      <p class="hint">Signal gespeichert · Bestellung in der Cloud.</p>
      <div class="actions">
        <button class="btn btn-ghost" id="again" type="button">Noch etwas bestellen</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { euro, money, setStatus } from "./js/shared.js?v=matrix4";
    import { getRound, addOrder, getActiveRoundId } from "./js/store.js?v=matrix4";
    import { mountHudBackground } from "./js/hud-bg.js?v=matrix4";

    mountHudBackground();

    const params = new URLSearchParams(location.search);
    const status = document.getElementById("status");
    const itemsBox = document.getElementById("items");
    let id = params.get("r");

    async function resolveRoundId() {
      if (id) return id;
      const active = await getActiveRoundId();
      if (!active) throw new Error("Keine offene Bestellrunde");
      id = active;
      history.replaceState(null, "", `${location.pathname}?r=${encodeURIComponent(id)}`);
      return id;
    }

    function itemRow() {
      const wrap = document.createElement("div");
      wrap.className = "row item-row";
      wrap.innerHTML = `
        <div class="field span-all">
          <label>Gericht</label>
          <input class="name" maxlength="80" placeholder="z. B. Pizza Salami" />
        </div>
        <div class="field">
          <label>Menge</label>
          <input class="qty" type="number" min="1" max="99" value="1" />
        </div>
        <div class="field">
          <label>Preis €</label>
          <input class="price" type="number" min="0" step="0.1" placeholder="0,00" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-danger btn-small remove" type="button">×</button>
        </div>
        <div class="field span-all">
          <label>Bemerkung</label>
          <input class="note" maxlength="160" placeholder="optional" />
        </div>
      `;
      wrap.querySelector(".remove").addEventListener("click", () => {
        wrap.remove();
        updateSubtotal();
      });
      wrap.querySelectorAll("input").forEach((input) => input.addEventListener("input", updateSubtotal));
      return wrap;
    }

    function readItems() {
      return [...itemsBox.querySelectorAll(".item-row")].map((row) => ({
        name: row.querySelector(".name").value.trim(),
        qty: Number(row.querySelector(".qty").value || 1),
        price: money(row.querySelector(".price").value || 0),
        note: row.querySelector(".note").value.trim()
      })).filter((item) => item.name);
    }

    function updateSubtotal() {
      const sum = readItems().reduce((acc, item) => acc + item.qty * item.price, 0);
      document.getElementById("subtotal").textContent = euro(sum);
    }

    document.getElementById("addItem").addEventListener("click", () => {
      itemsBox.appendChild(itemRow());
      updateSubtotal();
    });

    document.getElementById("again").addEventListener("click", () => {
      document.getElementById("done").hidden = true;
      document.getElementById("slogan").value = "";
      itemsBox.innerHTML = "";
      itemsBox.appendChild(itemRow());
      updateSubtotal();
      setStatus(status, "");
    });

    document.getElementById("send").addEventListener("click", async () => {
      try {
        if (!id) id = await resolveRoundId();
        const slogan = document.getElementById("slogan").value.trim();
        const items = readItems();
        if (!slogan) throw new Error("Bitte Slogan / Name eintragen");
        if (!items.length) throw new Error("Mindestens ein Gericht eintragen");
        setStatus(status, "Wird gespeichert…");
        await addOrder(id, { slogan, items });
        document.getElementById("done").hidden = false;
        setStatus(status, "Gespeichert.");
      } catch (error) {
        setStatus(status, error.message, true);
      }
    });

    itemsBox.appendChild(itemRow());
    updateSubtotal();
    setStatus(status, "Lade Runde…");

    resolveRoundId()
      .then((roundId) => getRound(roundId))
      .then((round) => {
        document.getElementById("heading").textContent = (round.title || "DONNERSTAG_ESSEN").toUpperCase();
        const bits = [];
        if (round.deliveryTime) bits.push(`Lieferzeit: ${round.deliveryTime}`);
        if (round.address) bits.push(String(round.address).split("\n")[0]);
        document.getElementById("meta").textContent = bits.length ? bits.join(" · ") : "Cloud-Sync aktiv";
        setStatus(status, "");
      })
      .catch((error) => setStatus(status, error.message, true));
  </script>
</body>
</html>
