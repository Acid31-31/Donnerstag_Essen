<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donnerstag_Essen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="shell">
    <section class="panel">
      <h2>Donnerstag_Essen</h2>
      <p class="hint" id="status">Wird geladen…</p>
    </section>
  </main>
  <script type="module">
    import { joinUrl, startUrl, setStatus } from "./js/shared.js";
    import { getActiveRoundId } from "./js/store.js";

    const status = document.getElementById("status");
    getActiveRoundId()
      .then((id) => {
        if (id) {
          location.replace(joinUrl(id));
          return;
        }
        status.innerHTML = `Noch keine offene Bestellung.<br><a href="${startUrl()}">Als Gastgeber starten</a>`;
      })
      .catch((error) => setStatus(status, error.message, true));
  </script>
</body>
</html>
