<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mittag am Donnerstag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="brand-mark">BR</div>
      <div>
        <h1>Mittag am Donnerstag</h1>
        <p>Gemeinsam bestellen. Getrennt beschriften.</p>
      </div>
    </div>

    <section class="panel">
      <h2>Neue Runde starten</h2>
      <p class="hint">Bestellungen liegen in der Cloud. Dein Handy darf aus sein — später siehst du alles sofort.</p>
      <div class="field">
        <label for="title">Name der Runde</label>
        <input id="title" maxlength="80" placeholder="z. B. Mittag am Donnerstag" value="Mittag am Donnerstag" />
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="create" type="button">Runde erstellen</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>
  <script type="module">
    import { saveHostKey, hostUrl, newId, setStatus } from "./js/shared.js";
    import { createRound } from "./js/store.js";

    const status = document.getElementById("status");
    document.getElementById("create").addEventListener("click", async () => {
      try {
        setStatus(status, "Runde wird angelegt…");
        const round = await createRound(document.getElementById("title").value);
        saveHostKey(round.id, newId(16));
        location.href = hostUrl(round.id);
      } catch (error) {
        setStatus(status, error.message, true);
      }
    });
  </script>
</body>
</html>
